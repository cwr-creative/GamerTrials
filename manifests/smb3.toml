# Super Mario Bros. 3 (NES).
#
# Everything this project knows about SMB3. The harness that used to hold it
# was ~900 lines of Rust; this file replaced all of it (invariant 5). The
# schema is documented in docs/manifest-schema.md, and the address provenance
# — which of these are playtested and which are only documented — is in
# docs/games/smb3.md.

schema_version = 3

[game]
id = "smb3"
title = "Super Mario Bros. 3"
console = "nes"
region = "usa"
# NTSC NES. Every duration a challenge authors in seconds is converted at this
# rate, once, at load.
framerate = 60.0988

[[rom]]
id = "base"
name = "Super Mario Bros. 3 (USA) (Rev 1)"
path = "assets/ROMs/Super Mario Bros. 3 (USA) (Rev 1).nes"
header = "ines"
# sha1 is deliberately absent: no hash has been taken against a verified dump.
# `asset-store` will require one before a ROM can be accepted from a player.

[runner]
kind = "libretro"

[runner.libretro]
core_dir = "cores"
pad_layout = "nes"

[runner.libretro.memory]
# NES CPU addresses. Internal RAM is $0000-$07FF and arrives as system RAM.
base = 0x0000
size = 0x0800
system_ram_bytes = 2048
default_width = "u8"
# The map first, and this is load-bearing rather than a preference: the card
# counter at $7D9C is in cartridge WRAM, Mesen does not publish that as save
# RAM (it is not battery-backed on this cart), and the memory map the core
# publishes through SET_MEMORY_MAPS is the only route to it. A core that
# publishes no map still resolves $0000-$07FF through the fallback, and
# startup says which addresses went unreadable.
prefer = "memory_map"

# ---------------------------------------------------------------- what to read

[watch.return_to_map]
at = 0x0014
note = "verified: flag to return to the map"

[watch.map_y]
at = 0x0078
note = "verified: map position, half of the level id"

[watch.map_x]
at = 0x0079
note = "verified: map position, half of the level id"

[watch.object_set]
at = 0x070A
note = "verified: level object set"

[watch.world]
at = 0x0727
note = "verified: world - 1, so world 1 reads 0"

[watch.lives]
at = 0x0736
note = "verified: Mario lives"

[watch.powerup]
at = 0x0578
note = "Data Crystal: powerup/form. Not playtested here"

[watch.hit_timer]
at = 0x0552
note = "Data Crystal: hit-invulnerability timer. Not playtested here"

[watch.pipe_timer]
at = 0x0510
note = "Data Crystal: pipe transit countdown. Not playtested here"

[watch.stomp_counter]
at = 0x05F4
note = "Data Crystal: stomp kills only - fireball/shell/star do not touch it"

[watch.cards]
at = 0x7D9C
note = "verified: card count, in cartridge WRAM. Needs the core's memory map"

# Player_Score is three bytes, most significant first, holding the displayed
# score / 10 — the trailing zero on screen is not stored. A watch cannot read
# it as one number: there is no 3-byte width, and byte order belongs to the
# address space, which is little-endian. Nothing here needs the number itself.
# The rule below needs only to see the low byte move.
[watch.score_hi]
at = 0x0715
note = "disassembly: Player_Score, high byte"

[watch.score_mid]
at = 0x0716
note = "disassembly: Player_Score, middle byte"

[watch.score_lo]
at = 0x0717
note = "verified: Player_Score, low byte. A 100-point stomp took it 00 -> 0A"

# $0727 holds world - 1, and a manifest does no arithmetic on purpose — a rule
# language that could add one to a byte would be a rule language that could do
# anything. A label says what the byte means instead, which is the same
# information and stays readable next to the raw value.
[label.world]
0x00 = "world 1"
0x01 = "world 2"
0x02 = "world 3"
0x03 = "world 4"
0x04 = "world 5"
0x05 = "world 6"
0x06 = "world 7"
0x07 = "world 8"

[label.powerup]
0x00 = "small"
0x01 = "super"
0x02 = "fire"
0x03 = "raccoon"
0x04 = "frog"
0x05 = "tanooki"
0x06 = "hammer"

[display]
fields = ["world", "map_x", "map_y", "object_set", "lives", "powerup", "cards"]

# --------------------------------------------------------------- what it means

# A card is an early, unambiguous win signal for the levels that award one. It
# fires seconds before $0014 moves — 348 frames, measured — and it never fires
# on a death, so there is no lives check to disambiguate it. Declared first, so
# that on a frame where both could fire, the card is the verdict.
[[rule]]
field = "cards"
edge = "increases"
emit = "stage_cleared"
log = "a card was awarded"

# A decrease in lives means the player died
[[rule]]
field = "lives"
edge = "decreases"
emit = "died"
log = "you suck at mario 3"

# Everything else that leaves the level. $0014 alone cannot tell a death from a
# card-less level (fortress, castle, airship) cleared normally, so the reason is
# `unknown` and it is honestly unknown — not a placeholder. ADR 0014 is where
# that gap has to be closed.
[[rule]]
field = "return_to_map"
edge = "leaves"
value = 0
emit = "stage_exited"
reason = "unknown"
log = "no card was seen: this is a death, or a card-less level cleared"

[[rule]]
field = "hit_timer"
edge = "leaves"
value = 0
emit = "damaged"

[[rule]]
field = "stomp_counter"
edge = "increases"
emit = "enemy_defeated"
log = "stomps only; a fireball or shell kill does not count here"

# One event per award of points, whatever earned it. `changes` rather than
# `increases`, for two reasons. `increases` counts the delta, so a 100-point
# stomp would count ten. And this byte wraps every 2,560 points, and an award
# that carries reads as a decrease, which `increases` would miss. Every award
# SMB3 makes (10, 50, 100 ... 8000) moves the low byte, since none is a
# multiple of 2,560, and the score never falls during a stage.
#
# Points are not kills. A coin is 50, a broken brick 10, and the time bonus
# counts down into the score after the card. A criterion may read this as
# "an enemy was defeated" only on a stage where nothing else awards points.
# The time bonus never counts, because the card has already ended the attempt.
[[rule]]
field = "score_lo"
edge = "changes"
emit = "count"
counter = "score_award"

[[rule]]
field = "powerup"
edge = "changes"
emit = "note"
log = "powerup/form changed"


# The flag clearing again means the hand-off to the map has finished, so the
# next attempt gets a clean slate. Without this the verdict latches for the
# whole process: one card early in a run would silence every later death, which
# is a bug this project has already shipped once.
[[attempt.reset_on]]
field = "return_to_map"
edge = "enters"
value = 0

# ------------------------------------------------------------------- stages
#
# Where a run starts, and nothing else. Which kinds a stage can host is not
# declared here — it is expressed by which [[challenge]] entries name it.
#
# The stage a state drops you into is known from the entry point that put you
# there, never read out of RAM. SMB3 has no "current level number" at all: a
# level is identified by the map tile you entered from.

[[stage]]
id = "1-1"
name = "World 1-1"
rom = "base"
entry = { state = "assets/states/smb3_1-1.state" }

[[stage]]
id = "1-2"
name = "World 1-2"
rom = "base"
entry = { state = "assets/states/smb3_1-2.state" }

[[stage]]
id = "1-3"
name = "World 1-3"
rom = "base"
entry = { state = "assets/states/smb3_1-3.state" }

[[stage]]
id = "1-4"
name = "World 1-4"
rom = "base"
entry = { state = "assets/states/smb3_1-4.state" }
note = "forced-scrolling: everyone finishes in the same number of frames, so there is no time trial on it"

# --------------------------------------------------------------- challenges
#
# Every challenge a player can be dealt in SMB3, written out one at a time
# (ADR 0017). Nothing is inferred from a stage: a level that should be playable
# both ways is two entries, and if all 100 levels of a game want that, it is 200
# entries. That is the deal — in exchange, everything a player can be dealt is
# visible in this file.
#
# `cleared = true` here means the card rule fired, which is the honest end of a
# card-awarding level. A fortress or an airship awards no card and would need
# ADR 0014's missing detector before it could carry this criterion.

[[challenge]]
id = "1-1-time-trial"
stage = "1-1"
kind = "time_trial"
complete_when = { cleared = true }

[[challenge]]
id = "1-1-survival"
stage = "1-1"
kind = "survival"
complete_when = { cleared = true }

[[challenge]]
id = "1-2-time-trial"
stage = "1-2"
kind = "time_trial"
complete_when = { cleared = true }

[[challenge]]
id = "1-2-survival"
stage = "1-2"
kind = "survival"
complete_when = { cleared = true }

[[challenge]]
id = "1-3-time-trial"
stage = "1-3"
kind = "time_trial"
complete_when = { cleared = true }

[[challenge]]
id = "1-3-survival"
stage = "1-3"
kind = "survival"
complete_when = { cleared = true }

# No time trial on this one: everyone finishes a forced-scrolling level in the
# same number of frames, so there is nothing to race. The stage's own note says
# why, and the absence of the entry is how the constraint is expressed.
[[challenge]]
id = "1-4-survival"
stage = "1-4"
kind = "survival"
complete_when = { cleared = true }

# A worked example of a criterion that is not "reach the end", and of a second
# challenge sharing a stage with others. Not playtested: $05F4 counts stomps
# only — a fireball, shell or star kill does not touch it — so five stomps means
# five stomps. See docs/games/smb3.md.
[[challenge]]
id = "1-1-stomp-rush"
name = "World 1-1: Five Stomps"
stage = "1-1"
kind = "time_trial"
complete_when = { enemies_defeated = 5 }
note = "the clock stops on the fifth stomp; reaching the end of the level is not required"

# --------------------------------------------------------- generated content
#
# A hand-authored hack and the two custom challenges that live on it. Both are
# transcribed from docs/games/smb3.md, which is where the offsets came from and
# where the reasoning for every pool is written down.
#
# The hack is carried as a BPS patch against the base ROM and never as a ROM
# (ADR 0020): a patch encodes differences, and the platform does not distribute
# a derivative of a dump the player supplied for themselves. It shares this
# manifest because it reads the same addresses, which is the only condition
# under which a second ROM may — a hack that moved one would be a second
# manifest.

# The third export of the editor project. It replaced hack1, which is still in
# assets/patches because content-gen's golden hashes were recorded against it.
# The two differ only in Bro Roulette. Goomba 1 starts one tile up and one
# right. The blocks under it are wood rather than bumpable, so it cannot be
# killed from below. That matters because a Fire or Boomerang Bro in the next
# slot runs its bump check on the goomba's floor tile, and died with it
# (docs/games/smb3.md). The layout also lost one three-byte object, which moved
# every layout after it back three bytes. That is why ~2,900 bytes differ.
# Sun Storm's object list and layout are byte-identical.
[[rom]]
id = "hack3"
name = "SMB3: Gamer Trials"
from = "base"
patch = "assets/patches/smb3-rom-hack3.bps"
sha1 = "0c963c375888d3b94690f703cd4a1b297c2551f6"

[[stage]]
id = "sun-storm"
name = "Sun Storm"
rom = "hack3"
entry = { state = "assets/states/smb3_sun-storm-hack3.state" }
note = "captured on hack3, on the World 1 map, on the tile that enters W2_32 — not inside the level, so the object index is built from the rolled list"

[[stage]]
id = "bro-roulette"
name = "Bro Roulette"
rom = "hack3"
entry = { state = "assets/states/smb3_bro-roulette-hack3.state" }
note = "captured on hack3, on the World 1 map, on the tile that enters W1_03"

# --- Sun Storm --------------------------------------------------------------
#
# One to three Angry Suns, from the object list at $C6BC. $BB is
# OBJ_CANCELEVENT: it becomes a level event, never an actor, and is how an empty
# slot is spelled under pure value substitution (docs/games/smb3.md, finding 6).
# Slot C is fixed and is the highest column deliberately — a sun activates on
# accumulated scroll, so the rightmost one goes first and every roll delivers
# its first sun at the same point in the level.
#
# The two kinds repeat the table rather than sharing it. patch_slot hangs off
# [[challenge]], so nothing stops the copies drifting; that is a known wart and
# the strongest argument for hanging it off [[stage]] instead.

[[challenge]]
id = "sun-storm-survival"
name = "Sun Storm"
stage = "sun-storm"
kind = "survival"
complete_when = { cleared = true }
generator_version = 1

[[challenge.patch_slot]]
offset = 0xC6BD                        # slot A, column $01
width = "u8"
values = { pool = [0xAF, 0xBB] }       # a sun, or nothing at all

[[challenge.patch_slot]]
offset = 0xC6C0                        # slot B, column $03
width = "u8"
values = { pool = [0xAF, 0xBB] }

[[challenge.patch_slot]]
offset = 0xC6C3                        # slot C, column $05 — always a sun
width = "u8"
values = { pool = [0xAF] }

[[challenge]]
id = "sun-storm-time-trial"
name = "Sun Storm"
stage = "sun-storm"
kind = "time_trial"
complete_when = { cleared = true }
generator_version = 1

[[challenge.patch_slot]]
offset = 0xC6BD
width = "u8"
values = { pool = [0xAF, 0xBB] }

[[challenge.patch_slot]]
offset = 0xC6C0
width = "u8"
values = { pool = [0xAF, 0xBB] }

[[challenge.patch_slot]]
offset = 0xC6C3
width = "u8"
values = { pool = [0xAF] }

# --- Bro Roulette -----------------------------------------------------------
#
# Four goombas from the object list at $C6CA, each independently either a goomba
# or one of four bros. The repeated 0x72 entries are the weighting and are not a
# mistake: the pool is a multiset, so a coin flip decides whether a goomba is
# replaced and the four variants share the other half evenly. An engine that
# deduplicated this pool would make it a 20% roll without saying so.
#
# Not a permutation group. A group forces each member to appear exactly once,
# and two hammer bros is a legal outcome here — so is four goombas, at 6.25%.
#
# generator_version 2: version 1 carried 0xBB where the four 0x72s are, so a
# slot that was not replaced rolled to nothing, and the four stomps the criteria
# need were unreachable unless every slot rolled a bro. Playtested to its
# criteria on version 2.
#
# A kill is four awards of points, not four stomps. $05F4 counts stomps only,
# and a bro is as likely to die some other way. Points stand in for kills here
# on the claim that nothing else on this stage awards them: no powerups and no
# items. A coin or a broken brick added to the level would count as a kill.
# Changing the criteria rolls nothing differently, so generator_version does
# not move. Playtested on seed 9: three goombas stomped, and the hammer bro
# killed from below with a block, which $05F4 never saw.

[[challenge]]
id = "bro-roulette-time-trial"
name = "Bro Roulette"
stage = "bro-roulette"
kind = "time_trial"
complete_when = { counts = { score_award = 4 } }
generator_version = 2
note = "the clock stops on the fourth kill, by any means; reaching the card is not required"

[[challenge.patch_slot]]
offset = 0xC6CB                        # goomba 1, column $03
width = "u8"
values = { pool = [0x72, 0x72, 0x72, 0x72, 0x81, 0x82, 0x86, 0x87] }

[[challenge.patch_slot]]
offset = 0xC6CE                        # goomba 2, column $0A
width = "u8"
values = { pool = [0x72, 0x72, 0x72, 0x72, 0x81, 0x82, 0x86, 0x87] }

[[challenge.patch_slot]]
offset = 0xC6D1                        # goomba 3, column $0D
width = "u8"
values = { pool = [0x72, 0x72, 0x72, 0x72, 0x81, 0x82, 0x86, 0x87] }

[[challenge.patch_slot]]
offset = 0xC6D4                        # goomba 4, column $0D
width = "u8"
values = { pool = [0x72, 0x72, 0x72, 0x72, 0x81, 0x82, 0x86, 0x87] }

[[challenge]]
id = "bro-roulette-survival"
name = "Bro Roulette"
stage = "bro-roulette"
kind = "survival"
complete_when = { counts = { score_award = 4 } }
generator_version = 2

[[challenge.patch_slot]]
offset = 0xC6CB
width = "u8"
values = { pool = [0x72, 0x72, 0x72, 0x72, 0x81, 0x82, 0x86, 0x87] }

[[challenge.patch_slot]]
offset = 0xC6CE
width = "u8"
values = { pool = [0x72, 0x72, 0x72, 0x72, 0x81, 0x82, 0x86, 0x87] }

[[challenge.patch_slot]]
offset = 0xC6D1
width = "u8"
values = { pool = [0x72, 0x72, 0x72, 0x72, 0x81, 0x82, 0x86, 0x87] }

[[challenge.patch_slot]]
offset = 0xC6D4
width = "u8"
values = { pool = [0x72, 0x72, 0x72, 0x72, 0x81, 0x82, 0x86, 0x87] }
