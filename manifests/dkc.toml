# Donkey Kong Country (SNES).
#
# Everything this project knows about DKC. The schema is documented in
# docs/manifest-schema.md; the provenance of every address below — almost all
# of it corroborated against the RetroAchievements code notes — is in
# docs/games/dkc.md and docs/games/dkc-ra-code-notes.md.
#
# Read the address caveat there before trusting a number: most of this has two
# independent sources and none of it has a full playtest.

schema_version = 3

[game]
id = "dkc"
title = "Donkey Kong Country"
console = "snes"
region = "usa"
framerate = 60.0988

[[rom]]
id = "base"
name = "Donkey Kong Country (U) (V1.0) [!]"
path = "assets/ROMs/snes/Donkey Kong Country (U) (V1.0) [!].smc"
# A SNES ROM has no magic number - its header is in-band, at a position that
# depends on the mapper. All that can be checked cheaply is the size and
# whether it carries a 512-byte copier header, which shifts every ROM offset.
header = "copier-optional"
min_bytes = 32768
# sha1 deliberately absent; see the note in smb3.toml.

[runner]
kind = "libretro"

[runner.libretro]
# SNES cores live in their own folder so "the single *_libretro.dll" stays
# unambiguous now that the library has two consoles in it.
core_dir = "cores/snes"
pad_layout = "snes"

[runner.libretro.memory]
# SNES work RAM, $7E:0000-$7F:FFFF. snes9x hands all 128 KB over as system RAM
# and publishes no SET_MEMORY_MAPS descriptors at all, so the slice is the only
# route that works here — the opposite of the NES side. Addresses may be
# written as offsets ($0527) or in full ($7E0527); they mean the same byte.
base = 0x7E0000
size = 0x20000
system_ram_bytes = 131072
prefer = "system_ram"
# DKC's game logic runs the 65816 with a 16-bit accumulator, so u16 is the
# safer default for anything that looks like a count. Fields known to be a
# single byte say so.
default_width = "u16"

# ---------------------------------------------------------------- what to read

[watch.in_stage]
at = 0x0527
width = "u8"
note = "RA notes: 00 = in a stage, 01 = overworld. The spine of stage completion"

[watch.level_id]
at = 0x003E
note = "RA notes + RainbowZ: room id (last exit used). Naming only"

[watch.room_id]
at = 0x0040
note = "RA notes: last room id inside a level, else 0"

[watch.lives]
at = 0x0575
note = "RA notes: lives. $0577, which every older map quotes, is the display copy"

[watch.bananas]
at = 0x057B
note = "RA notes: bananas / mini animal tokens, up to 999"

[watch.kong_letters]
at = 0x057F
width = "u8"
note = "RA notes: KONG letters flag. Unmarked in the notes, so a byte"

[watch.fade_type]
at = 0x051B
width = "u8"
note = "RA notes + dkc1-hack: 0x82 = screen fading out. Playtested"

[watch.state_flags]
at = 0x0579
width = "u8"
note = "RA notes: b0 = 2 Kongs, b6 = paused"

[watch.hit_timer]
at = 0x16D1
note = "RA notes: DK flash timer, set on taking a hit (Diddy $16D3)"

[watch.animal]
at = 0x0516
width = "u8"
note = "RA notes: riding buddy"

[watch.enemy_kills]
at = 0x1E17
width = "u8"
note = "RA notes: enemies stomped in a row - a streak, not a running total"

[watch.player_x]
at = 0x005E
note = "RA notes: active character's X coord"

[watch.player_y]
at = 0x0060
note = "RA notes: active character's Y coord"

[watch.dk_x]
at = 0x0FC3
note = "RA notes: DK's position X (Diddy $0FC5)"

[watch.dk_y]
at = 0x0FF7
note = "RA notes: DK's position Y (Diddy $0FF9)"

[watch.accept_inputs]
at = 0x1929
note = "dkc1-hack defines.asm; no RA note, so the one address on a single source"

# No address, and so no detector - which is the honest state, not a broken one.
# Damage reads state_flags bit 0 instead. If a real Kong counter ever turns up,
# giving this an `at` is the whole change.
[watch.kong_count]
note = "UNKNOWN - nobody has found a dedicated Kong counter"

[label.in_stage]
0x00 = "in a stage"
0x01 = "overworld"

[label.animal]
0x00 = "none"
0x09 = "Rambi"
0x0A = "Expresso"
0x0B = "Winky"
0x0C = "Enguarde"

[display]
fields = [
    "in_stage",
    "level_id",
    "room_id",
    "lives",
    "bananas",
    "kong_letters",
    "state_flags",
    "fade_type",
]

# ------------------------------------------------------------------- markers

# The fade-to-black the game sets on any scene change that takes the player out
# of the current room. A death causes no fade at all, so this can never fire
# from one, and it is not a verdict on its own — a bonus barrel sets the same
# value the exit does. All it supplies is the frame: the stage ended when the
# screen started to go dark, not when the overworld finished loading (ADR 0005).
#
# 120 frames is two seconds at 60 Hz, far longer than the hand-off. A fade with
# nothing behind it is discarded rather than left armed to mis-time a later,
# unrelated exit.
[[marker]]
name = "fade"
field = "fade_type"
edge = "enters"
value = 0x82
window_frames = 120

# Quitting from the pause menu reaches the overworld exactly as the exit does.
# The pause flag at the moment the fade began is the only thing separating them,
# and it has to be read then: by the time the map is up, the menu is long gone.
[[marker.capture]]
name = "paused"
field = "state_flags"
test = "bit_set"
bit = 6

# --------------------------------------------------------------- what it means

# A life lost means the same thing everywhere in DKC: pit, water, enemy contact
# with a single Kong. Named, because the damage rules below have to know it
# fired — dying with one Kong clears the two-Kong bit as well, and that is one
# event, not damage plus a death.
[[rule]]
name = "death"
field = "lives"
edge = "decreases"
emit = "died"

[[rule]]
field = "lives"
edge = "decreases"
emit = "stage_exited"
reason = "death"

[[rule]]
field = "state_flags"
edge = "bit_cleared"
bit = 0
unless = ["death"]
emit = "damaged"
log = "lost the partner Kong"

[[rule]]
field = "kong_count"
edge = "decreases"
unless = ["death"]
emit = "damaged"
log = "kept for a real Kong counter, if one ever turns up"

[[rule]]
field = "hit_timer"
edge = "leaves"
value = 0
unless = ["death"]
emit = "damaged"
log = "the hit that fires when a solo Kong is hit and has no partner to lose"

[[rule]]
field = "enemy_kills"
edge = "increases"
emit = "enemy_defeated"
log = "a stomp streak, so this undercounts a stage"

[[rule]]
field = "bananas"
edge = "increases"
emit = "item"
item = "banana"

# One event per letter newly held, out of one byte.
[[rule]]
field = "kong_letters"
edge = "bits_set"
bit_labels = ["K", "O", "N", "G"]
emit = "item"
item = "kong_letter"

[[rule]]
field = "lives"
edge = "increases"
emit = "item"
item = "extra_life"

# Mounting a buddy, not dismounting one: the guard is what keeps a return to 0
# from reading as a pickup.
[[rule]]
field = "animal"
edge = "changes"
guard = { field = "animal", test = "ne", value = 0 }
emit = "item"
item = "animal_buddy"

# $7E0527 is the game's own answer to "is the player inside a stage?", and it is
# the whole completion rule. Every way of *staying* in a level leaves it at 00:
# a bonus room, the return from one, a checkpoint, a death and the reload it
# causes. Only actually leaving flips it, so the route a player takes through a
# stage cannot change the verdict — a property this gets for free, where the
# scheme it replaced needed all 230 level names and a table of shared animal
# rooms to reconstruct it from the outside.
#
# The quit case is declared first, because both rules watch the same edge and
# the first match is the verdict.
[[rule]]
field = "in_stage"
edge = "leaves"
value = 0x00
timed_to = "fade"
if_marked = "paused"
emit = "stage_exited"
reason = "quit"
log = "the fade began while paused, so this is a menu quit"

[[rule]]
field = "in_stage"
edge = "leaves"
value = 0x00
timed_to = "fade"
emit = "stage_cleared"

# ------------------------------------------------------------------- stages
#
# Where a run starts, and nothing else. Which kinds a stage can host is not
# declared here — it is expressed by which [[challenge]] entries name it.

[[stage]]
id = "jungle-hijinx"
name = "Jungle Hijinx"
rom = "base"
entry = { state = "assets/states/dkc_jungle-hijinxs.state" }

[[stage]]
id = "reptile-rumble"
name = "Reptile Rumble"
rom = "base"
entry = { state = "assets/states/dkc_reptile-rumble.state" }

[[stage]]
id = "ropey-rampage"
name = "Ropey Rampage"
rom = "base"
entry = { state = "assets/states/dkc_ropey-rampage.state" }

[[stage]]
id = "barrel-cannon-canyon"
name = "Barrel Cannon Canyon"
rom = "base"
entry = { state = "assets/states/dkc_barrel-cannon-canyon.state" }

[[stage]]
id = "coral-capers"
name = "Coral Capers"
rom = "base"
entry = { state = "assets/states/dkc_coral-capers.state" }

[[stage]]
id = "mine-cart-carnage"
name = "Mine Cart Carnage"
rom = "base"
entry = { state = "assets/states/dkc_mine-cart-carnage.state" }
note = "forced-scrolling: everyone finishes in the same number of frames, so there is no time trial on it"

# --------------------------------------------------------------- challenges
#
# Every challenge a player can be dealt in DKC, written out one at a time
# (ADR 0017). `cleared = true` is `in_stage` leaving 00 without the pause flag —
# the rule above — so it holds however the player routed through the level.

[[challenge]]
id = "jungle-hijinx-time-trial"
stage = "jungle-hijinx"
kind = "time_trial"
complete_when = { cleared = true }

[[challenge]]
id = "jungle-hijinx-survival"
stage = "jungle-hijinx"
kind = "survival"
complete_when = { cleared = true }

[[challenge]]
id = "reptile-rumble-time-trial"
stage = "reptile-rumble"
kind = "time_trial"
complete_when = { cleared = true }

[[challenge]]
id = "reptile-rumble-survival"
stage = "reptile-rumble"
kind = "survival"
complete_when = { cleared = true }

[[challenge]]
id = "ropey-rampage-time-trial"
stage = "ropey-rampage"
kind = "time_trial"
complete_when = { cleared = true }

[[challenge]]
id = "ropey-rampage-survival"
stage = "ropey-rampage"
kind = "survival"
complete_when = { cleared = true }

[[challenge]]
id = "barrel-cannon-canyon-time-trial"
stage = "barrel-cannon-canyon"
kind = "time_trial"
complete_when = { cleared = true }

[[challenge]]
id = "barrel-cannon-canyon-survival"
stage = "barrel-cannon-canyon"
kind = "survival"
complete_when = { cleared = true }

[[challenge]]
id = "coral-capers-time-trial"
stage = "coral-capers"
kind = "time_trial"
complete_when = { cleared = true }

[[challenge]]
id = "coral-capers-survival"
stage = "coral-capers"
kind = "survival"
complete_when = { cleared = true }

# No time trial: a forced-scrolling level is the same length for everyone.
[[challenge]]
id = "mine-cart-carnage-survival"
stage = "mine-cart-carnage"
kind = "survival"
complete_when = { cleared = true }

# Two challenges on one stage, which is the normal case rather than an edge one.
# Forty-five seconds of a mine cart is a different ask from the whole level, and
# `survive_seconds` is the only criterion that ends a run by itself — the others
# wait on the player doing something.
[[challenge]]
id = "mine-cart-carnage-45s"
name = "Mine Cart Carnage: 45 Seconds"
stage = "mine-cart-carnage"
kind = "survival"
complete_when = { survive_seconds = 45.0 }

# Conjunction, and the per-bit item naming: `kong_letters` is one byte, and the
# `bit_labels` on its rule are what turn bit 2 into `kong_letter:N`. All four
# letters *and* the exit, as fast as you can — either alone is a different
# challenge, and neither is this one.
[[challenge]]
id = "jungle-hijinx-kong"
name = "Jungle Hijinx: K-O-N-G"
stage = "jungle-hijinx"
kind = "time_trial"
note = "every DKC level holds exactly four letters; the counts are 1 each, not 4 of one"

[challenge.complete_when]
cleared = true
items_collected = { "kong_letter:K" = 1, "kong_letter:O" = 1, "kong_letter:N" = 1, "kong_letter:G" = 1 }

