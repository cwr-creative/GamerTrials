<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GamerTrials</title>
<style>
  html, body { margin: 0; height: 100%; background: #14142a; color: #eee;
               font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  .page { position: absolute; inset: 0; }
  .hidden { display: none !important; }
  button { font: inherit; font-size: 1.05em; padding: .5em 1.4em; margin: .3em;
           border: 3px solid #ffb347; background: #2a2a55; color: #fff; cursor: pointer; }
  button:hover:not(:disabled) { background: #3a3a77; }
  button:disabled { opacity: .45; cursor: default; }
  input, select { font: inherit; padding: .25em .4em; background: #22224a; color: #fff;
                  border: 2px solid #555; }
  input[type=number] { width: 5em; }
  h1 { margin: .2em 0; }
  h2, h3 { color: #ffb347; margin: .4em 0; }

  /* Main menu: a large piece of art, random every launch. */
  #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #art { width: 60vw; height: 40vh; border: 6px solid #ffb347; box-shadow: 0 0 40px #000;
         display: flex; align-items: center; justify-content: center; font-size: 8em; }
  #menu .buttons { margin-top: 1em; display: flex; flex-direction: column; }
  #menu button { font-size: 1.3em; min-width: 12em; }
  #notice { color: #ff8080; min-height: 1.5em; margin-top: .5em; }
  #join-row { display: flex; align-items: center; justify-content: center; margin: .3em; }
  #join-row input { width: 16em; margin-right: .3em; }
  #invite-line { color: #aaa; font-size: .9em; margin: -.2em 0 .8em; }
  #invite-line code { color: #fff; font-size: 1.15em; user-select: text; }
  #invite-line button { font-size: .8em; padding: .2em .7em; }
  #lobby .right .row2 { display: flex; gap: .3em; margin-top: auto; }
  #lobby .right .row2 #start { flex: 1; margin-top: 0; }
  #lobby.guest fieldset, #lobby.guest #tree { opacity: .7; pointer-events: none; }

  /* Lobby: settings and the tree on the left, players and start on the right. */
  #lobby { display: grid; grid-template-columns: 1fr 22em; gap: 1em; padding: 1em; box-sizing: border-box; }
  #lobby .left { overflow: auto; }
  #lobby .right { display: flex; flex-direction: column; }
  fieldset { border: 2px solid #444; margin: 0 0 1em; }
  fieldset label { display: inline-block; margin: .3em 1em .3em 0; }
  #tree { font-size: .95em; }
  .cat, .game { margin-left: 0; }
  .cat > .row { font-weight: 700; font-size: 1.1em; margin-top: .6em; }
  .game { margin-left: 1.6em; }
  .game > .row { font-weight: 600; }
  .chal { margin-left: 3.2em; display: grid; grid-template-columns: 1.6em 1fr auto; gap: .4em; align-items: start; }
  .chal.off { opacity: .45; }
  .chal .goal { color: #aaa; font-size: .9em; }
  .chal .tag { color: #ffb347; font-size: .8em; letter-spacing: .1em; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: .4em; cursor: pointer; }
  .row input { cursor: pointer; }
  #players li { list-style: none; margin: .3em 0; }
  #players .missing { color: #ff8080; font-size: .85em; margin-left: 1em; word-break: break-all; }
  #players .ok { color: #8f8; font-size: .85em; }
  #blocking { color: #ffb347; font-size: .9em; min-height: 3em; }
  #start { font-size: 1.4em; margin-top: auto; }
  .keys { color: #888; font-size: .85em; margin-top: .5em; }

  /* Settings: tabs on top, scopes on the left, the scope's settings on the right. */
  #settings { display: grid; grid-template-columns: 17em 1fr; grid-template-rows: auto 1fr auto;
              gap: .6em 1em; padding: 1em; box-sizing: border-box; }
  #settings .top { grid-column: 1 / 3; display: flex; align-items: center; gap: .5em; }
  #settings .top h2 { margin: 0 1em 0 0; }
  .tab { border-color: #555; }
  .tab.on { border-color: #ffb347; background: #3a3a77; }
  #s-back { margin-left: auto; }
  #s-scopes { overflow: auto; border-right: 2px solid #333; padding-right: .6em; }
  #s-scopes.hidden + #s-body { grid-column: 1 / 3; }
  .scope { padding: .35em .5em; cursor: pointer; border-left: 4px solid transparent; }
  .scope:hover { background: #22224a; }
  .scope.on { border-left-color: #ffb347; background: #2a2a55; }
  .scope.game { padding-left: 1.6em; font-size: .92em; }
  .sub { color: #888; font-size: .82em; }
  #s-body { overflow: auto; }
  #s-status { grid-column: 1 / 3; color: #8f8; font-size: .85em; min-height: 1.2em; }
  .note { color: #aaa; font-size: .88em; max-width: 52em; }
  .pad { width: 100%; max-width: 560px; display: block; margin: .3em 0 .6em; }
  .pad .body { fill: #22224a; stroke: #555; stroke-width: 3; }
  .pad .btn, .pad .dir { fill: #34346a; stroke: #888; stroke-width: 2; cursor: pointer; }
  .pad .dir { fill: #2a2a58; stroke-width: 1.5; }
  .pad .btn:hover, .pad .dir:hover { stroke: #ffb347; }
  .pad .btn.sel, .pad .dir.sel { stroke: #ffb347; stroke-width: 4; }
  .pad .btn.lit, .pad .dir.lit { fill: #ffb347; }
  .pad .btn.dim, .pad .lbl.dim { opacity: .25; }
  .pad .hub { fill: #34346a; }
  .pad .well { fill: #1a1a38; stroke: #555; stroke-width: 2; }
  .pad .lbl { fill: #fff; font-size: 14px; text-anchor: middle; pointer-events: none; font-weight: 600; }
  .pad .lbl.sm { font-size: 10px; }
  .pad .lbl.tiny { font-size: 10px; font-weight: 400; fill: #ccc; }
  select.stickto { width: 8.5em; }
  select.stickto.sel { outline: 2px solid #ffb347; }
  table.binds, table.remap, table.form { border-collapse: collapse; margin: .3em 0 .8em; }
  table.binds td, table.binds th, table.remap td, table.form td { padding: .22em .4em; text-align: left; }
  table.binds th { color: #888; font-weight: 400; font-size: .85em; }
  table.binds tr.sel { background: #2a2a55; }
  .bname { font-weight: 700; color: #ffb347; min-width: 4em; }
  table.binds .fam { padding-left: 1.2em; }
  .slot { display: inline-block; min-width: 5em; padding: .2em .45em; border: 2px solid #666; background: #22224a;
          cursor: pointer; white-space: nowrap; position: relative; }
  .slot:hover { border-color: #ffb347; }
  .slot.inh { color: #999; border-style: dashed; }
  .slot.add { color: #888; min-width: 1.5em; text-align: center; }
  .slot.lit { background: #ffb347; color: #000; }
  .slot .x { margin-left: .5em; color: #f88; }
  .from { color: #888; font-size: .82em; }
  .from a, #s-body a { color: #ffb347; }
  .row2 { margin: .4em 0; }
  h4 { color: #ffb347; margin: .8em 0 .2em; }
  #s-capture { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #s-capture .card { border: 4px solid #ffb347; background: #14142a; padding: 1.5em 2em; text-align: center; font-size: 1.2em; }
</style>
</head>
<body>
<div id="menu" class="page">
  <div id="art"></div>
  <h1>GamerTrials</h1>
  <label>Display name <input id="name" value="Player" maxlength="24"></label>
  <div class="buttons">
    <button id="host">Host game</button>
    <button id="join-open">Join game</button>
    <div id="join-row" class="hidden">
      <input id="invite" placeholder="host:port/CODE or wss://host/CODE" maxlength="300" spellcheck="false">
      <button id="join">Join</button>
    </div>
    <button id="settings-open">Settings</button>
  </div>
  <div id="notice"></div>
</div>

<div id="lobby" class="page hidden">
  <div class="left">
    <h2>Lobby <span id="code" style="color:#888;font-size:.7em"></span></h2>
    <div id="invite-line"></div>
    <fieldset>
      <label>Match mode
        <select id="mode">
          <option value="survival">Survival</option>
          <option value="time_trial">Time trial</option>
          <option value="combo">Combo</option>
        </select></label>
      <label>Duration
        <select id="fkind">
          <option value="challenges">Number of challenges</option>
          <option value="strikes">Number of strikes</option>
          <option value="wins">Number of wins</option>
          <option value="stock">Stock</option>
        </select>
        <input id="fn" type="number" min="1" max="999" value="10"></label>
      <label>Time limit per challenge <input id="limit" type="number" min="1" max="3600" value="180"> s</label>
      <label><input id="custom" type="checkbox" checked> Allow custom challenges</label>
      <label><input id="h2h" type="checkbox"> Allow head-to-head challenges</label>
      <label>Group by
        <select id="grouping">
          <option value="console">system</option>
          <option value="era">era</option>
          <option value="genre">genre</option>
        </select></label>
    </fieldset>
    <h3>Games</h3>
    <div id="tree"></div>
  </div>
  <div class="right">
    <h3>Players</h3>
    <ul id="players"></ul>
    <div id="blocking"></div>
    <div class="row2"><button id="start">Start</button><button id="leave">Leave</button></div>
    <div class="keys">In play: F9 gives up the run, F10 pauses (or Select + Start on a pad), F12 quits. Rebind them in Settings.</div>
  </div>
</div>

<div id="settings" class="page hidden">
  <div class="top">
    <h2>Settings</h2>
    <button id="tab-controls" class="tab">Controls</button>
    <button id="tab-video" class="tab">Video</button>
    <button id="tab-profile" class="tab">Profile</button>
    <button id="s-back">Back</button>
  </div>
  <div id="s-scopes"></div>
  <div id="s-body"></div>
  <div id="s-status"></div>
</div>
<div id="s-capture" class="hidden"><div class="card">
  <div id="s-capture-text"></div>
  <div class="note">A click anywhere binds the mouse button. Nothing for five seconds cancels too.</div>
</div></div>

<script>
  const $ = id => document.getElementById(id);
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const key = r => r.game + '/' + r.challenge;

  // Placeholder art: one of a few pictures, picked at launch.
  const ART = [['\u{1F344}', '#8b1a1a'], ['\u{1F98D}', '#1a5c2a'], ['\u{1F47E}', '#1a1a5c'],
               ['\u{1F3AE}', '#5c3a1a'], ['\u{1F3C1}', '#3a1a5c'], ['\u{1F4A5}', '#5c1a3a']];
  const pick = ART[Math.floor(Math.random() * ART.length)];
  $('art').textContent = pick[0];
  $('art').style.background = 'radial-gradient(circle at 30% 30%, #fff2 0, transparent 60%), ' + pick[1];

  let cat = null;      // the library, from Rust
  let lobby = null;    // the server's lobby state
  let enabled = new Set();
  let dealable = new Set();
  let me = null;       // this player's id in the lobby
  let invite = null;   // what a guest pastes to join; null in a lobby of one

  const isHost = () => !!lobby && lobby.players.length > 0 && lobby.players[0].id === me;

  $('host').onclick = () => { $('notice').textContent = ''; invoke('host', { name: $('name').value }); };
  $('join-open').onclick = () => { $('join-row').classList.toggle('hidden'); $('invite').focus(); };
  const join = () => {
    $('notice').textContent = 'Joining…';
    invoke('join', { name: $('name').value, invite: $('invite').value });
  };
  $('join').onclick = join;
  $('invite').onkeydown = e => { if (e.key === 'Enter') join(); };
  $('leave').onclick = () => invoke('leave');

  function settingsFromForm() {
    return {
      mode: $('mode').value,
      format: { kind: $('fkind').value, n: Math.max(1, parseInt($('fn').value) || 1) },
      default_limit_seconds: Math.max(1, parseFloat($('limit').value) || 180),
      allow_custom: $('custom').checked,
      allow_head_to_head: $('h2h').checked,
      grouping: $('grouping').value,
    };
  }
  for (const id of ['mode', 'fkind', 'fn', 'limit', 'custom', 'h2h', 'grouping']) {
    $(id).onchange = () => invoke('set_settings', { settings: settingsFromForm() });
  }
  $('start').onclick = () => invoke('start');

  function formToLobby() {
    const s = lobby.settings;
    $('mode').value = s.mode;
    $('fkind').value = s.format.kind;
    $('fn').value = s.format.n;
    $('limit').value = s.default_limit_seconds;
    $('custom').checked = s.allow_custom;
    $('h2h').checked = !!s.allow_head_to_head;
    $('grouping').value = s.grouping;
  }

  // ---- the tree -----------------------------------------------------------
  function categoryOf(game) {
    const g = lobby.settings.grouping;
    return g === 'era' ? game.era : g === 'genre' ? game.genre : game.console;
  }

  function sendEnabled() {
    invoke('set_enabled', { challenges: [...enabled].map(k => {
      const i = k.indexOf('/');
      return { game: k.slice(0, i), challenge: k.slice(i + 1) };
    }) });
  }

  function setBox(box, keys) {
    const on = keys.filter(k => enabled.has(k)).length;
    box.checked = on === keys.length && keys.length > 0;
    box.indeterminate = on > 0 && on < keys.length;
  }

  // Clicking a parent: indeterminate or off turns every child on; on turns them off.
  function toggleGroup(keys) {
    const on = keys.filter(k => enabled.has(k)).length;
    const turnOn = on < keys.length;
    for (const k of keys) { if (turnOn) enabled.add(k); else enabled.delete(k); }
    sendEnabled();
    renderTree();
  }

  function renderTree() {
    if (!cat || !lobby) return;
    const cats = new Map();
    for (const g of cat.games) {
      const c = categoryOf(g);
      if (!cats.has(c)) cats.set(c, []);
      cats.get(c).push(g);
    }
    const tree = $('tree');
    tree.innerHTML = '';
    for (const c of [...cats.keys()].sort()) {
      const games = cats.get(c).sort((a, b) => a.title.localeCompare(b.title));
      const catKeys = games.flatMap(g => g.challenges.map(ch => g.id + '/' + ch.id));
      const catEl = document.createElement('div'); catEl.className = 'cat';
      const catRow = document.createElement('div'); catRow.className = 'row';
      const catBox = document.createElement('input'); catBox.type = 'checkbox';
      setBox(catBox, catKeys);
      catRow.appendChild(catBox);
      catRow.appendChild(document.createTextNode(c));
      catRow.onclick = e => { e.preventDefault(); toggleGroup(catKeys); };
      catEl.appendChild(catRow);
      for (const g of games) {
        const gKeys = g.challenges.map(ch => g.id + '/' + ch.id);
        const gEl = document.createElement('div'); gEl.className = 'game';
        const gRow = document.createElement('div'); gRow.className = 'row';
        const gBox = document.createElement('input'); gBox.type = 'checkbox';
        setBox(gBox, gKeys);
        gRow.appendChild(gBox);
        gRow.appendChild(document.createTextNode(g.title + ' (' + g.console + ')'));
        gRow.onclick = e => { e.preventDefault(); toggleGroup(gKeys); };
        gEl.appendChild(gRow);
        for (const ch of g.challenges) {
          const k = g.id + '/' + ch.id;
          const el = document.createElement('div');
          el.className = 'chal' + (dealable.has(k) ? '' : ' off');
          const box = document.createElement('input'); box.type = 'checkbox';
          box.checked = enabled.has(k);
          box.onchange = () => { if (box.checked) enabled.add(k); else enabled.delete(k); sendEnabled(); renderTree(); };
          const text = document.createElement('div');
          text.innerHTML = '<div>' + esc(ch.name) + (ch.title !== g.title ? ' <span class="tag">on ' + esc(ch.title) + '</span>' : '') +
                           '</div><div class="goal">' + esc(ch.goal) + '</div>';
          const tag = document.createElement('div'); tag.className = 'tag';
          tag.textContent = (ch.kind === 'time_trial' ? 'TIME TRIAL' : 'SURVIVAL') +
                            (ch.generated ? ' · GENERATED' : ch.custom ? ' · HACK' : '') +
                            (dealable.has(k) || !enabled.has(k) ? '' : ' · NOT IN THIS MATCH');
          el.appendChild(box); el.appendChild(text); el.appendChild(tag);
          gEl.appendChild(el);
        }
        catEl.appendChild(gEl);
      }
      tree.appendChild(catEl);
    }
  }

  function renderPlayers() {
    const ul = $('players');
    ul.innerHTML = '';
    for (const p of lobby.players) {
      const li = document.createElement('li');
      let h = '<b>' + esc(p.name) + '</b>' + (p.host ? ' <span class="tag">HOST</span>' : '');
      if (!p.files) h += '<div class="missing">checking files…</div>';
      else if (p.files.missing.length === 0) h += '<div class="ok">has every file</div>';
      else for (const m of p.files.missing) {
        h += '<div class="missing">' + esc(m.game) + ': ' + esc(m.name) + ' — ' + esc(m.problem) +
             (m.sha1 ? '<br>sha1 ' + esc(m.sha1) : '') + '</div>';
      }
      li.innerHTML = h;
      ul.appendChild(li);
    }
    $('blocking').innerHTML = lobby.blocking.map(b => '⚠ ' + esc(b)).join('<br>');
    const host = isHost();
    $('start').disabled = !lobby.can_start || !host;
    $('start').textContent = host ? 'Start' : 'Waiting for the host';
    $('code').textContent = invite ? '' : lobby.code;
    $('invite-line').innerHTML = invite
      ? 'Invite: <code id="invite-code">' + esc(invite) + '</code> <button id="copy">Copy</button>'
      : 'Playing on this machine. Set a server in Settings › Profile to invite players.';
    if (invite) $('copy').onclick = () => {
      navigator.clipboard.writeText(invite).then(() => { $('copy').textContent = 'Copied'; }, () => {
        const r = document.createRange(); r.selectNodeContents($('invite-code'));
        getSelection().removeAllRanges(); getSelection().addRange(r);
      });
    };
    $('lobby').classList.toggle('guest', !host);
  }

  function render() {
    if (!lobby) { $('menu').classList.remove('hidden'); $('lobby').classList.add('hidden'); return; }
    $('menu').classList.add('hidden'); $('lobby').classList.remove('hidden');
    formToLobby();
    renderTree();
    renderPlayers();
  }

  async function init() {
    cat = await invoke('catalog');
    await window.__TAURI__.event.listen('lobby', e => {
      lobby = e.payload;
      enabled = new Set(lobby.enabled.map(key));
      dealable = new Set(lobby.dealable.map(key));
      render();
    });
    await window.__TAURI__.event.listen('notice', e => { $('notice').textContent = e.payload.text; });
    await window.__TAURI__.event.listen('session', e => { me = e.payload.me; invite = e.payload.invite; });
    await window.__TAURI__.event.listen('left', () => { lobby = null; me = null; invite = null; render(); });
  }
  init().catch(e => { $('notice').textContent = 'cannot reach the client: ' + e; });
</script>
<script src="settings.js"></script>
</body>
</html>
