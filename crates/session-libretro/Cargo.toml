[package]
name = "session-libretro"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The libretro adapter, for every libretro game. What used to be
# `smb3-harness` and `dkc-harness`; the two dissolved into this crate plus two
# TOML files in `manifests/` (ADR 0012, ADR 0016). There is no per-game Rust
# here and there must not be one: a new libretro game is a new manifest.

[dependencies]
session-api = { path = "../session-api" }
# The challenge half of a manifest — `[game]`, stage names, `[[challenge]]` and
# the emit vocabulary — which the server reads too (ADR 0009, ADR 0024). The
# loader here parses through it first and reads only the runner half itself.
challenge-library = { path = "../challenge-library" }
# Stage prep applies a contributor's BPS patch and rolls a generated
# challenge's patch slots before a runner ever sees the bytes (ADR 0015,
# ADR 0020). The dependency goes this way and never the other: `content-gen`
# has no idea an emulator exists.
content-gen = { path = "../content-gen" }
# For the harness binary only, which is wiring rather than the adapter: it
# feeds what the runner reports to `challenge-core` and carries out the verdict.
# The library half of this crate must never use it — an adapter that judged a
# run is the mistake ADR 0017 exists to prevent. The dependency points the
# allowed way: core still knows nothing of this crate (invariant 1).
challenge-core = { path = "../challenge-core" }
# For the harness binary only, likewise: `--synctest` proves a core rolls
# back exactly by driving the runner through the bout session with no network
# (ADR 0036). The library half must never use it.
head-to-head = { path = "../head-to-head" }

libloading = "0.8"   # load the libretro core ourselves (ADR 0001)
# Window + framebuffer blit + keyboard. X11 only on Linux, never Wayland: the
# client's overlay has to sit over this window, which Wayland does not allow
# (ADR 0035), and XWayland runs it on a Wayland desktop.
minifb = { version = "0.27", default-features = false, features = ["x11"] }
cpal = "0.15"        # audio out (WASAPI on Windows, ALSA on Linux)
gilrs = "0.11"       # gamepad (XInput/DirectInput; evdev on Linux)
serde = { version = "1", features = ["derive"] }
toml = "0.9"         # manifests are TOML data in git (ADR 0010)

# Holding the mouse in the window, which minifb cannot do (`input::Mouse`).
# Already in the tree through minifb, at the same version.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }

# The same on X11, and the client's X11 calls besides (`x11`). Loaded at run
# time, as minifb loads it, so the build needs no X11 headers.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

# The developer harness: run a manifest's game in a window and watch RAM. Not
# the client — it prints events and scores nothing.
[[bin]]
name = "harness"
path = "src/bin/harness.rs"
