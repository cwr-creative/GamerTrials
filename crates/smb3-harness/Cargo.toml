[package]
name = "smb3-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# Phase 1 scaffolding. Deliberately SMB3-specific; dissolves into
# `session-libretro` in Phase 2, once DKC exists to abstract against.

[dependencies]
libloading = "0.8"   # load the libretro core ourselves (ADR 0001)
minifb = "0.27"      # window + framebuffer blit + keyboard
cpal = "0.15"        # audio out (WASAPI on Windows)
gilrs = "0.11"       # gamepad (XInput/DirectInput)

[[bin]]
name = "smb3-harness"
path = "src/main.rs"
