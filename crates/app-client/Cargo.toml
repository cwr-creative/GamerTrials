[package]
name = "app-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The GamerTrials client: a native game window under a transparent Tauri overlay (ADR 0027)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
session-api = { path = "../session-api" }
session-libretro = { path = "../session-libretro" }
challenge-core = { path = "../challenge-core" }
challenge-library = { path = "../challenge-library" }
protocol = { path = "../protocol" }
# The socket loop the server runs too (ADR 0034).
transport = { path = "../transport" }
# Solo play runs the server's half in-process (ADR 0009): the same crate a
# remote server will run, over a channel instead of a socket.
server = { path = "../server" }
asset-store = { path = "../asset-store" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The player's settings file (ADR 0028).
toml = "0.9"
# Only its X11 backend on Linux, as in `session-libretro` (ADR 0035).
minifb = { version = "0.27", default-features = false, features = ["x11"] }
# `native-tls` dials `wss://` through SChannel, or OpenSSL on Linux (ADR
# 0033); the server never holds a certificate, so `server-net` has no such
# feature.
tungstenite = { version = "0.29", features = ["native-tls"] }
openh264 = "0.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef", "basetsd", "minwindef"] }

# The webviews' X11 window ids (`overlay::handle`), at the version Tauri uses.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
