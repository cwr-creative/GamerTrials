# `ROM.Level.cs`, where the array index *is* the level code. Nothing scores off
# this any more — `in_stage` decides the verdict — but it is what makes a log
# readable, and it used to be 347 lines of Rust for exactly the same reason.
# See docs/games/dkc.md for which of the editor's two tables this is and why.

