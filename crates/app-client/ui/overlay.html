<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GamerTrials overlay</title>
<style>
  /* A transparent sheet over the game window. Everything on it is a
     placeholder: crude, but it animates on and off the way the final assets
     will, and the choreography — what waits for what — lives here, so a
     final asset with another duration changes nothing in Rust. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
               user-select: none; }
  #stage { position: fixed; inset: 0; }
  .sheet { position: absolute; inset: 0; display: flex; align-items: center;
           justify-content: center; }
  .hidden { display: none !important; }
  .card { text-align: center; padding: 1.6em 2.4em; border: 4px solid #ffb347;
          background: #1d1d3a; box-shadow: 0 0 40px #000; max-width: 90%;
          max-height: 90%; overflow: auto; }
  .card h1 { margin: 0 0 .4em; font-size: 2em; }
  .card h2 { margin: 0 0 .4em; font-size: 1.3em; color: #ffb347; }
  button { font: inherit; font-size: 1.1em; padding: .5em 1.4em; margin: .4em;
           border: 3px solid #ffb347; background: #2a2a55; color: #fff; cursor: pointer; }
  button:hover { background: #3a3a77; }
  #pause button.focus { background: #3a3a77; outline: 3px solid #fff; }
  table { border-collapse: collapse; margin: .6em auto; font-size: 1.05em; }
  th, td { padding: .25em .7em; text-align: left; }
  th { color: #ffb347; border-bottom: 2px solid #ffb347; }
  tr.me td { color: #c8f0ff; font-weight: 700; }
  tr.out td { opacity: .55; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Challenge intro: a card that drops in, holds, and slides out. */
  #intro { background: rgba(10, 10, 30, 0.85); transform: translateY(-110%);
           transition: transform 500ms cubic-bezier(.2,.9,.3,1.1); }
  #intro.in  { transform: translateY(0); }
  #intro.out { transform: translateY(110%); transition-timing-function: ease-in; }
  #intro .console { font-size: 1.1em; letter-spacing: .3em; color: #ffb347; }
  #intro .title { font-size: 2.4em; font-weight: 800; margin: .2em 0; }
  #intro .name { font-size: 1.1em; color: #aaa; margin-bottom: .6em; }
  #intro .goal { font-size: 1.5em; color: #c8f0ff; }
  #intro .kind { font-size: .95em; color: #ffb347; margin-top: .8em; letter-spacing: .15em; }

  /* Countdown: one big number that pops. */
  #count { font-size: 9em; font-weight: 900; text-shadow: 0 0 30px #000, 0 0 6px #000;
           opacity: 0; transform: scale(.4); pointer-events: none; }
  #count.pop { animation: pop 900ms ease-out; }
  @keyframes pop { 0% { opacity: 1; transform: scale(1.6); }
                   70% { opacity: 1; transform: scale(1); }
                   100% { opacity: 0; transform: scale(.9); } }

  /* Death: a red flash, under half a second. */
  #flash { background: rgba(200, 0, 0, 0); pointer-events: none; }
  #flash.hit { animation: flash 450ms ease-out; }
  @keyframes flash { 0% { background: rgba(200, 0, 0, .75); } 100% { background: rgba(200, 0, 0, 0); } }

  /* Garland or skull: a badge that swings in and fades, above every sheet —
     in a solo match the round card is up before it has finished. */
  #badge { position: absolute; z-index: 10; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0);
           font-size: 7em; filter: drop-shadow(0 0 20px #000); pointer-events: none;
           text-align: center; }
  #badge small { display: block; font-size: .22em; color: #fff; text-shadow: 0 0 8px #000; }
  #badge.show { animation: badge 2200ms ease-out forwards; }
  @keyframes badge { 0% { transform: translate(-50%, -50%) scale(0) rotate(-30deg); opacity: 1; }
                     25% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
                     40% { transform: translate(-50%, -50%) scale(1); }
                     80% { opacity: 1; } 100% { opacity: 0; } }

  /* A time trial's clock: the run's frames across every attempt, read out
     in seconds at the core's own rate. A guide for the player; the score is
     the frames. */
  #clock { position: absolute; right: 14px; top: 10px; font-size: 2em; font-weight: 800;
           font-variant-numeric: tabular-nums; text-shadow: 0 0 8px #000, 0 0 3px #000;
           pointer-events: none; }
  #clock.stopped { color: #ffb347; }

  /* Spectating (ADR 0032): another player's picture, decoded here, over an
     opaque sheet — the game window behind holds this player's last frame. */
  #spectate { background: #000; flex-direction: column; }
  #feed { image-rendering: pixelated; background: #000; }
  #sp-bar { display: flex; align-items: center; gap: .6em; margin-top: .4em; font-size: 1.2em; }
  #sp-bar button { padding: .2em .8em; margin: 0; }
  #sp-name { min-width: 10em; text-align: center; font-weight: 700; }
  #sp-note { color: #aaa; font-size: .9em; min-height: 1.2em; }

  /* Where the watched run stands, from the server's own judging (ADR 0034):
     a line under the picture, and the whole view when the picture cannot
     keep up -- then the last frame dims and the run takes over. */
  #sp-view { position: relative; }
  #sp-slow { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             text-align: center; padding: 1em; font-weight: 700; text-shadow: 0 0 8px #000; }
  #spectate.slow #feed { opacity: .25; }
  #sp-run { display: flex; gap: 1.2em; align-items: baseline; font-variant-numeric: tabular-nums; min-height: 1.4em; }
  #sp-clock { font-size: 1.4em; font-weight: 800; }
  #sp-events { color: #ccc; font-size: .9em; }
  #spectate.slow #sp-run { font-size: 1.6em; }

  /* The sidebar (ADR 0038): the right of the window, where the game window
     leaves black, holds up to three other players' pictures, stacked and
     named. Its width is reckoned as video.rs reckons it (--side); the clock,
     the corner readout and the spectate view keep to the left of it. */
  :root { --side: 0px; }
  #thumbs { position: absolute; right: 0; top: 0; bottom: 0; width: var(--side);
            display: none; flex-direction: column; pointer-events: none; }
  body.sidebar #thumbs { display: flex; }
  .thumb { position: relative; flex: 1 1 0; min-height: 0; display: flex; align-items: center;
           justify-content: center; overflow: hidden; border-left: 2px solid #222;
           border-bottom: 2px solid #222; }
  .thumb:last-child { border-bottom: 0; }
  .thumb canvas { image-rendering: pixelated; background: #000; }
  .thumb .label { position: absolute; left: 0; right: 0; bottom: 0; padding: .15em .5em;
                  font-weight: 700; background: rgba(0, 0, 0, .6); text-shadow: 0 0 4px #000;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb.empty canvas, .thumb.empty .label { display: none; }
  body.sidebar #clock { right: calc(var(--side) + 14px); }
  body.sidebar #hud { right: calc(var(--side) + 8px); }
  body.sidebar #spectate { right: var(--side); }

  #round, #score, #pause { background: rgba(10, 10, 30, 0.8); }
  #error { position: absolute; left: 0; right: 0; top: 0; padding: .6em 1em;
           background: rgba(160, 0, 0, .9); font-weight: 700; text-align: center; }
  #waiting { position: absolute; left: 0; right: 0; bottom: 2em; text-align: center;
             font-size: 1.3em; text-shadow: 0 0 8px #000; pointer-events: none; }

  /* A corner readout so a screenshot says what the page thinks is going on. */
  #hud { position: absolute; right: 8px; bottom: 6px; font: 12px monospace;
         color: #ffb347; text-shadow: 0 0 4px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="intro" class="sheet"><div class="card">
    <div class="console" id="i-console"></div>
    <div class="title" id="i-title"></div>
    <div class="name" id="i-name"></div>
    <div class="goal" id="i-goal"></div>
    <div class="kind" id="i-kind"></div>
  </div></div>
  <div id="count" class="sheet"></div>
  <div id="flash" class="sheet"></div>
  <div id="clock" class="hidden"></div>
  <div id="badge"></div>
  <div id="spectate" class="sheet hidden">
    <div id="sp-view">
      <canvas id="feed" width="256" height="240"></canvas>
      <div id="sp-slow" class="hidden">Connection too slow for live video.<br>Following the run instead.</div>
    </div>
    <div id="sp-run"><span id="sp-clock"></span><span id="sp-attempt"></span><span id="sp-events"></span></div>
    <div id="sp-bar"><button id="sp-prev">&#9664;</button><span id="sp-name"></span><button id="sp-next">&#9654;</button></div>
    <div id="sp-note"></div>
  </div>
  <div id="thumbs">
    <div class="thumb empty"><canvas width="256" height="240"></canvas><div class="label"></div></div>
    <div class="thumb empty"><canvas width="256" height="240"></canvas><div class="label"></div></div>
    <div class="thumb empty"><canvas width="256" height="240"></canvas><div class="label"></div></div>
  </div>
  <div id="waiting" class="hidden"></div>
  <div id="backing" class="sheet hidden"><div class="card">
    <h2>Pick a side</h2>
    <div id="b-text"></div>
    <div id="b-buttons"></div>
    <div id="b-note"></div>
  </div></div>
  <div id="round" class="sheet hidden"><div class="card">
    <h2 id="r-title"></h2>
    <table id="r-entries"></table>
    <h2>Standings</h2>
    <table id="r-standings"></table>
    <div id="r-note"></div>
  </div></div>
  <div id="score" class="sheet hidden"><div class="card">
    <h1>Match over</h1>
    <div id="s-format"></div>
    <table id="s-standings"></table>
    <div id="s-host"><button id="again">Play again</button><button id="lobby">Back to lobby</button></div>
    <div id="s-guest" class="hidden">Waiting for the host… <button id="s-leave">Leave</button></div>
  </div></div>
  <div id="pause" class="sheet hidden"><div class="card">
    <h1>Paused</h1>
    <div><button id="resume">Resume</button><button id="giveup">Give up the run</button><button id="end">End match</button><button id="leave" class="hidden">Leave match</button></div>
    <div id="pause-keys" style="margin-top:.8em;color:#aaa;font-size:.9em"></div>
  </div></div>
  <div id="error" class="hidden"></div>
  <div id="hud">overlay: waiting</div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
  const hud = s => { $('hud').textContent = 'overlay: ' + s; };
  const show = id => $(id).classList.remove('hidden');
  const hide = id => $(id).classList.add('hidden');
  const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const now = () => performance.now();
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  // ---- choreography -------------------------------------------------------
  // The round card holds for ROUND_MS before the next intro may replace it;
  // the intro holds for INTRO_MS before the countdown may start. The game
  // begins exactly when the countdown says ("begin"), never before.
  const ROUND_MS = 3500, INTRO_MS = 2500;
  let roundUntil = 0;      // when the round card may go
  let introAt = 0;         // when the intro came up
  let introUp = false;
  let goWanted = false;    // the server said go; waiting on the intro
  let counting = false;
  let playing = [];        // who is still playing this round, for the waiting line

  const waitingText = () => playing.length
    ? 'Waiting for ' + playing.map(esc).join(', ') + '…'
    : 'Waiting for the round to end…';
  function showWaiting(text) { $('waiting').innerHTML = text; show('waiting'); }

  // ---- backing a slot in a bout (ADR 0036) --------------------------------
  // Not seated this round: pick who to back before the window closes, or be
  // given a side. The pick is one click; the sheet stays until the bout goes.
  let backingRound = null, backingTimer = null, backed = null;
  function showBacking(p) {
    backingRound = p.round; backed = null;
    $('b-text').textContent = "You're not in this bout. Back a player to share their result:";
    $('b-buttons').innerHTML = '';
    for (const name of p.players || []) {
      const b = document.createElement('button');
      b.textContent = name;
      b.onclick = () => { backed = name; invoke('back', { player: name }); paintBacking(); };
      $('b-buttons').appendChild(b);
    }
    const until = now() + (p.seconds || 15) * 1000;
    clearInterval(backingTimer);
    backingTimer = setInterval(() => {
      const left = Math.max(0, Math.ceil((until - now()) / 1000));
      if (!backed) $('b-note').textContent = left + 's until a side is picked for you';
      if (left === 0) clearInterval(backingTimer);
    }, 250);
    paintBacking();
    show('backing');
    hud('backing, round ' + p.round);
  }
  function paintBacking() {
    for (const b of $('b-buttons').children) b.classList.toggle('focus', b.textContent === backed);
    if (backed) $('b-note').textContent = 'Backing ' + backed;
  }
  function onSides(p) {
    if (p.round !== backingRound) return;
    for (const [who, target] of p.backing || []) if (who === p.me) { backed = target; paintBacking(); }
  }
  function hideBacking() { clearInterval(backingTimer); backingRound = null; hide('backing'); }

  // The round will not be played: whatever was on the way to a countdown stops.
  function dropRound() {
    goWanted = false; introUp = false;
    $('intro').classList.remove('in');
    if (!counting) $('intro').classList.add('out');
  }

  async function showIntro(p) {
    const delay = roundUntil - now();
    if (delay > 0) await wait(delay);
    hide('round'); hide('waiting'); hide('error');
    $('i-console').textContent = p.console || '';
    $('i-title').textContent = p.title || '';
    $('i-name').textContent = p.name || '';
    $('i-goal').textContent = p.goal || '';
    $('i-kind').textContent = (p.challenge_kind || '').toUpperCase() + (p.custom ? ' · CUSTOM' : '') +
      ((p.vs || []).length ? ' · VS ' + p.vs.join(', ') : '');
    $('intro').classList.remove('out');
    $('intro').classList.add('in');
    introUp = true; introAt = now();
    hud('intro');
    tryGo();
  }

  async function tryGo() {
    if (!goWanted || !introUp || counting) return;
    counting = true; goWanted = false;
    const left = introAt + INTRO_MS - now();
    if (left > 0) await wait(left);
    $('intro').classList.remove('in');
    $('intro').classList.add('out');
    hud('intro out');
    await wait(600);
    for (const n of [3, 2, 1]) {
      $('count').textContent = n;
      replay($('count'), 'pop');
      hud('countdown ' + n);
      await wait(900);
    }
    introUp = false; counting = false;
    invoke('begin');
    $('count').textContent = 'GO';
    replay($('count'), 'pop');
    hud('playing');
  }

  // ---- the clock ----------------------------------------------------------
  // `m:ss.t`, truncated, so it never reads a tenth ahead of the frames.
  function showClock(p) {
    const tenths = Math.floor(p.frames * 10 / p.fps);
    const m = Math.floor(tenths / 600), s = Math.floor(tenths / 10) % 60;
    $('clock').textContent = m + ':' + String(s).padStart(2, '0') + '.' + tenths % 10;
    $('clock').classList.toggle('stopped', !!p.stopped);
    show('clock');
  }
  const hideClock = () => hide('clock');

  // ---- cards --------------------------------------------------------------
  const endingText = e => !e ? '' :
    e.type === 'completed' ? 'completed' :
    e.type === 'failed' ? 'failed: ' + e.how :
    e.type === 'timed_out' ? 'timed out' : 'gave up';

  const formatText = f => !f ? '' :
    f.kind === 'challenges' ? f.n + ' challenges' :
    f.kind === 'strikes' ? f.n + ' strikes' :
    f.kind === 'wins' ? 'first to ' + f.n + ' wins' : 'stock ' + f.n;

  function standingsTable(el, standings, mode, format, me) {
    const figure = mode === 'time_trial' ? 'Frames' : mode === 'survival' ? 'Completed' : 'Points';
    const extra = !format ? null :
      format.kind === 'strikes' ? 'Streak' : format.kind === 'wins' ? 'Wins' :
      format.kind === 'stock' ? 'Lives' : null;
    let h = '<tr><th>#</th><th>Player</th><th class="num">' + figure + '</th><th class="num">Rounds</th>' +
            (extra ? '<th class="num">' + extra + '</th>' : '') + '</tr>';
    for (const s of standings) {
      const fig = mode === 'time_trial' ? s.frames : mode === 'survival' ? s.completions : s.points;
      const ex = !extra ? '' : extra === 'Streak' ? s.streak : extra === 'Wins' ? s.wins :
                 Math.max(0, format.n - s.failures);
      h += '<tr class="' + (s.player === me ? 'me' : '') + (s.eliminated != null ? ' out' : '') + '">' +
           '<td>' + s.rank + '</td><td>' + esc(s.player) + (s.eliminated != null ? ' (out)' : '') + '</td>' +
           '<td class="num">' + fig + '</td><td class="num">' + s.rounds + '</td>' +
           (extra ? '<td class="num">' + ex + '</td>' : '') + '</tr>';
    }
    el.innerHTML = h;
  }

  function showRound(p) {
    hide('intro'); $('intro').classList.remove('in', 'out'); hide('waiting');
    $('r-title').textContent = 'Round ' + (p.round + 1) + ' · ' + (p.title || '');
    let h = '<tr><th>Place</th><th>Player</th><th>Result</th><th class="num">Frames</th><th class="num">Attempts</th></tr>';
    for (const e of p.entries) {
      h += '<tr class="' + (e.player === p.me ? 'me' : '') + '"><td>' + e.place + '</td><td>' + esc(e.player) +
           '</td><td>' + endingText(e.outcome.ending) + (e.points ? ' (+' + e.points + ')' : '') +
           '</td><td class="num">' + e.frames + '</td><td class="num">' + e.outcome.attempts + '</td></tr>';
    }
    $('r-entries').innerHTML = h;
    standingsTable($('r-standings'), p.standings, p.mode, p.format, p.me);
    $('r-note').textContent = p.eliminated.length ? 'Eliminated: ' + p.eliminated.join(', ') : '';
    show('round');
    // The intro sheet is display:flex again on the next showIntro.
    $('intro').classList.remove('hidden');
    roundUntil = now() + ROUND_MS;
    hud('round ' + p.round + ' result');
  }

  async function showScore(p) {
    const delay = roundUntil - now();
    if (delay > 0) await wait(delay);
    hide('round'); hide('waiting'); hidePause();
    $('s-format').textContent = formatText(p.format) + (p.mode ? ' · ' + p.mode.replace('_', ' ') : '');
    standingsTable($('s-standings'), p.standings, p.mode, p.format, p.me);
    $('s-host').classList.toggle('hidden', !p.host);
    $('s-guest').classList.toggle('hidden', !!p.host);
    show('score');
    hud('match over');
  }

  // ---- spectating (ADR 0032) -----------------------------------------------
  // Picture and sound arrive as the sender made them, over the same socket
  // as everything else. Both are shown LEAD_MS after they arrive: the two
  // left the sender together and travelled together, so one fixed delay
  // keeps them together here and absorbs the socket's jitter. Sound that
  // falls further behind than that is dropped to catch up rather than
  // piling up as latency.
  const LEAD_MS = 150;
  const spec = { players: [], player: null, decoder: null, size: null, needKey: true,
                 frames: [], raf: null, audio: null, nextTime: 0, timer: null, padWas: null,
                 painted: [], since: 0, slow: false, run: null, said: [],
                 configuring: false, failures: 0, broken: null };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function closeFeed() {
    spec.painted = []; spec.since = now(); spec.run = null; spec.said = [];
    setSlow(false); showRun();
    if (spec.decoder) { try { spec.decoder.close(); } catch (e) {} spec.decoder = null; }
    spec.size = null; spec.needKey = true;
    for (const f of spec.frames) f.frame.close();
    spec.frames = [];
    if (spec.audio) { try { spec.audio.close(); } catch (e) {} spec.audio = null; }
    spec.nextTime = 0;
  }
  function closeSpectate() {
    closeFeed();
    hide('spectate');
    clearInterval(spec.timer); spec.timer = null;
    if (spec.raf) { cancelAnimationFrame(spec.raf); spec.raf = null; }
  }

  function showSpectate(p) {
    if (spec.player !== p.player) closeFeed();
    spec.player = p.player; spec.players = p.players || [];
    $('sp-name').textContent = p.player ? 'Watching ' + p.player : 'Nobody left to watch';
    const several = spec.players.length > 1;
    $('sp-prev').classList.toggle('hidden', !several);
    $('sp-next').classList.toggle('hidden', !several);
    $('sp-note').textContent = !('VideoDecoder' in window) ? 'This webview cannot decode video.' : spec.broken || '';
    show('spectate'); hide('waiting');
    if (!spec.timer) spec.timer = setInterval(() => { pollSpectatePad(); checkFeed(); showRun(); }, 50);
    if (!spec.raf) spec.raf = requestAnimationFrame(paintDue);
    hud(p.player ? 'watching ' + p.player : 'nobody to watch');
  }

  function switchPlayer(step) {
    if (spec.players.length < 2) return;
    const i = Math.max(0, spec.players.indexOf(spec.player));
    const next = spec.players[(i + step + spec.players.length) % spec.players.length];
    if (next && next !== spec.player) invoke('watch', { player: next });
  }

  function fitFeed(w, h, aspect) {
    const c = $('feed');
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const availW = window.innerWidth - sideWidth(), availH = window.innerHeight - 70;
    const ar = aspect > 0 ? aspect : w / h;
    let ch = Math.min(availH, availW / ar), cw = ch * ar;
    c.style.width = Math.floor(cw) + 'px'; c.style.height = Math.floor(ch) + 'px';
  }

  async function onVideo(p) {
    if (!('VideoDecoder' in window) || !spec.player || p.player !== spec.player) return;
    if (spec.broken || spec.configuring) return;
    const size = p.width + 'x' + p.height;
    if (!spec.decoder || spec.size !== size) {
      if (spec.decoder) { try { spec.decoder.close(); } catch (e) {} spec.decoder = null; }
      const config = { codec: 'avc1.42E01E', optimizeForLatency: true };
      // One check at a time: pictures keep arriving while it is awaited, and
      // each would otherwise build a decoder of its own.
      spec.configuring = true;
      try {
        const ok = await VideoDecoder.isConfigSupported(config);
        if (!ok.supported) { giveUp('This webview cannot decode H.264.'); return; }
      } catch (e) { giveUp('Cannot decode: ' + e.message); return; }
      finally { spec.configuring = false; }
      if (p.player !== spec.player) return;
      const d = new VideoDecoder({
        output: frame => { spec.failures = 0; spec.frames.push({ frame, due: now() + LEAD_MS }); },
        error: e => decodeFailed(d, e.message),
      });
      d.configure(config);
      spec.decoder = d; spec.size = size; spec.needKey = true;
      fitFeed(p.width, p.height, p.aspect);
    }
    if (spec.needKey && !p.key) return;
    spec.needKey = false;
    try {
      spec.decoder.decode(new EncodedVideoChunk({
        type: p.key ? 'key' : 'delta', timestamp: p.frame * 16667, data: b64(p.data),
      }));
    } catch (e) { decodeFailed(spec.decoder, e.message); }
  }

  // A decoder that fails is closed for good — WebKitGTK closes one whose
  // GStreamer element cannot handle the stream, and every decode() after
  // that throws "not configured" — so it is dropped and the next key frame
  // builds another. One that fails every time is this machine's, not this
  // picture's: after a few the picture is given up, and the run stands in.
  const DECODE_TRIES = 3;
  function decodeFailed(d, why) {
    if (!d || d !== spec.decoder) return;
    try { d.close(); } catch (e) {}
    spec.decoder = null; spec.size = null; spec.needKey = true;
    hud('decode error: ' + why);
    if (++spec.failures >= DECODE_TRIES) giveUp('This machine cannot decode the video: ' + why);
  }
  function giveUp(why) {
    spec.broken = why;
    $('sp-note').textContent = why;
    slowText();
  }

  // Paints the newest frame that is due, and lets the older ones go.
  function paintDue() {
    spec.raf = requestAnimationFrame(paintDue);
    const t = now();
    let last = null;
    while (spec.frames.length && spec.frames[0].due <= t) {
      if (last) last.frame.close();
      last = spec.frames.shift();
    }
    if (!last) return;
    const c = $('feed');
    c.getContext('2d').drawImage(last.frame, 0, 0, c.width, c.height);
    last.frame.close();
    spec.painted.push(t);
  }

  // The picture is healthy while it paints at a watchable rate. Below that
  // the run panel takes over, and it hands back only once the picture has
  // held a better rate, so a link at the edge does not flicker between them.
  const SLOW_FPS = 8, GOOD_FPS = 15, WINDOW_MS = 3000;
  function checkFeed() {
    if (!spec.player) return;
    const t = now();
    while (spec.painted.length && spec.painted[0] < t - WINDOW_MS) spec.painted.shift();
    if (t - spec.since < WINDOW_MS) return;
    const fps = spec.painted.length * 1000 / WINDOW_MS;
    if (!spec.slow && fps < SLOW_FPS) setSlow(true);
    else if (spec.slow && fps >= GOOD_FPS) setSlow(false);
  }
  function setSlow(slow) {
    if (spec.slow === slow) return;
    spec.slow = slow;
    $('spectate').classList.toggle('slow', slow);
    $('sp-slow').classList.toggle('hidden', !slow);
    slowText();
    if (spec.player) hud(slow ? 'feed too slow: following the run' : 'feed back');
  }
  function slowText() {
    $('sp-slow').innerHTML = (spec.broken ? 'No live video on this machine.'
                                          : 'Connection too slow for live video.') + '<br>Following the run instead.';
  }

  // A Progress report: the clock as the server judged it on `frame`. It
  // runs on between reports at the game's rate, but never more than a
  // second past the last one, so a stalled link does not invent time.
  function onProgress(p) {
    if (!spec.player || p.player !== spec.player) return;
    spec.run = { clock: p.clock, fps: p.fps, attempt: p.attempt, at: now() };
    for (const e of p.events || []) spec.said.push(e);
    spec.said = spec.said.slice(-3);
    showRun();
  }
  function showRun() {
    const r = spec.run;
    if (!r) { $('sp-clock').textContent = ''; $('sp-attempt').textContent = ''; $('sp-events').textContent = ''; return; }
    const ahead = Math.min(now() - r.at, 1000) * r.fps / 1000;
    const tenths = Math.floor((r.clock + ahead) * 10 / r.fps);
    const m = Math.floor(tenths / 600), sec = Math.floor(tenths / 10) % 60;
    $('sp-clock').textContent = m + ':' + String(sec).padStart(2, '0') + '.' + tenths % 10;
    $('sp-attempt').textContent = 'attempt ' + r.attempt;
    $('sp-events').textContent = spec.said.join(' · ');
  }

  // IMA ADPCM, as `stream.rs` writes it: per channel a predictor (i16 LE)
  // and step index, then the sample count (u32 LE), then nibbles in sample
  // order, channels interleaved, low nibble first.
  const STEPS = [7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,
    130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,
    1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,
    9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767];
  const INDEX_STEPS = [-1,-1,-1,-1,2,4,6,8,-1,-1,-1,-1,2,4,6,8];
  function adpcmDecode(bytes, channels) {
    const coders = [];
    let at = 0;
    for (let c = 0; c < channels; c++) {
      const predictor = (bytes[at] | (bytes[at + 1] << 8)) << 16 >> 16;
      coders.push({ predictor, index: bytes[at + 2] });
      at += 3;
    }
    const count = bytes[at] | (bytes[at + 1] << 8) | (bytes[at + 2] << 16) | (bytes[at + 3] << 24);
    at += 4;
    const frames = Math.floor(count / channels);
    const out = []; for (let c = 0; c < channels; c++) out.push(new Float32Array(frames));
    for (let i = 0; i < frames * channels; i++) {
      const byte = bytes[at + (i >> 1)];
      const n = (i & 1) ? (byte >> 4) : (byte & 15);
      const k = coders[i % channels];
      const step = STEPS[k.index];
      let delta = step >> 3;
      if (n & 4) delta += step;
      if (n & 2) delta += step >> 1;
      if (n & 1) delta += step >> 2;
      k.predictor += (n & 8) ? -delta : delta;
      if (k.predictor > 32767) k.predictor = 32767; else if (k.predictor < -32768) k.predictor = -32768;
      k.index += INDEX_STEPS[n];
      if (k.index < 0) k.index = 0; else if (k.index > 88) k.index = 88;
      out[i % channels][Math.floor(i / channels)] = k.predictor / 32768;
    }
    return out;
  }

  function onAudio(p) {
    if (!spec.player || p.player !== spec.player) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!spec.audio) { spec.audio = new AC(); spec.nextTime = 0; }
    const ctx = spec.audio;
    if (ctx.state === 'suspended') ctx.resume();
    const pcm = adpcmDecode(b64(p.data), p.channels);
    const frames = pcm[0].length;
    if (!frames) return;
    const buf = ctx.createBuffer(p.channels, frames, p.rate);
    for (let c = 0; c < p.channels; c++) buf.copyToChannel(pcm[c], c);
    const lead = LEAD_MS / 1000, t = ctx.currentTime;
    // Ran dry, or just started: begin again a lead ahead. Too far ahead:
    // this chunk is dropped so the lead does not grow into latency.
    if (spec.nextTime < t + lead / 2) spec.nextTime = t + lead;
    else if (spec.nextTime > t + lead * 2) return;
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    src.start(spec.nextTime);
    spec.nextTime += buf.duration;
  }

  // ---- the sidebar (ADR 0038) ---------------------------------------------
  // Up to three other players still playing, each picture from a decoder of
  // its own and painted as soon as it is decoded: there is no sound to keep
  // it in step with. The flow says who is in which box; a box whose player
  // changes starts again from that player's next key frame.
  const thumbs = [...document.querySelectorAll('.thumb')].map(el => ({
    el, canvas: el.querySelector('canvas'), label: el.querySelector('.label'),
    player: null, decoder: null, size: null, aspect: 0, needKey: true, frame: null,
    configuring: false, failures: 0, broken: false,
  }));
  let thumbRaf = null;

  // As video.rs's sidebar_width: four ninths of the height, at most two
  // fifths of the width.
  const sideWidth = () => document.body.classList.contains('sidebar')
    ? Math.min(Math.floor(window.innerHeight * 4 / 9), Math.floor(window.innerWidth * 2 / 5)) : 0;
  function layoutSide() {
    document.documentElement.style.setProperty('--side', sideWidth() + 'px');
    for (const b of thumbs) fitThumb(b);
  }

  function closeThumb(b) {
    if (b.decoder) { try { b.decoder.close(); } catch (e) {} b.decoder = null; }
    if (b.frame) { b.frame.close(); b.frame = null; }
    b.size = null; b.needKey = true; b.failures = 0; b.broken = false;
    b.canvas.getContext('2d').clearRect(0, 0, b.canvas.width, b.canvas.height);
  }

  function onThumbs(p) {
    document.body.classList.toggle('sidebar', !!p.sidebar);
    layoutSide();
    const players = p.players || [];
    thumbs.forEach((b, i) => {
      const player = players[i] || null;
      if (b.player !== player) { closeThumb(b); b.player = player; }
      b.label.textContent = player || '';
      b.el.classList.toggle('empty', !player);
    });
    if (p.sidebar && !thumbRaf) thumbRaf = requestAnimationFrame(paintThumbs);
    if (!p.sidebar && thumbRaf) { cancelAnimationFrame(thumbRaf); thumbRaf = null; }
  }

  function fitThumb(b) {
    // A box with no picture yet holds a 4:3 one.
    const ar = b.aspect > 0 ? b.aspect : 4 / 3;
    const w = b.el.clientWidth, h = b.el.clientHeight;
    const ch = Math.min(h, w / ar), cw = ch * ar;
    b.canvas.style.width = Math.floor(cw) + 'px'; b.canvas.style.height = Math.floor(ch) + 'px';
  }

  async function onThumb(p) {
    if (!('VideoDecoder' in window)) return;
    const b = thumbs.find(b => b.player === p.player);
    if (!b || b.broken || b.configuring) return;
    const size = p.width + 'x' + p.height;
    if (!b.decoder || b.size !== size) {
      if (b.decoder) { try { b.decoder.close(); } catch (e) {} b.decoder = null; }
      const config = { codec: 'avc1.42E01E', optimizeForLatency: true };
      b.configuring = true;
      try {
        const ok = await VideoDecoder.isConfigSupported(config);
        if (!ok.supported) { thumbGiveUp(b); return; }
      } catch (e) { thumbGiveUp(b); return; }
      finally { b.configuring = false; }
      if (b.player !== p.player) return;
      const d = new VideoDecoder({
        output: frame => { b.failures = 0; if (b.frame) b.frame.close(); b.frame = frame; },
        error: e => thumbFailed(b, d, e.message),
      });
      d.configure(config);
      b.decoder = d; b.size = size; b.needKey = true;
      if (b.canvas.width !== p.width || b.canvas.height !== p.height) { b.canvas.width = p.width; b.canvas.height = p.height; }
      b.aspect = p.aspect;
      fitThumb(b);
    }
    if (b.needKey && !p.key) return;
    b.needKey = false;
    try {
      b.decoder.decode(new EncodedVideoChunk({
        type: p.key ? 'key' : 'delta', timestamp: p.frame * 16667, data: b64(p.data),
      }));
    } catch (e) { thumbFailed(b, b.decoder, e.message); }
  }

  // As the full picture's decoder: dropped on failure, given up after a few.
  function thumbFailed(b, d, why) {
    if (!d || d !== b.decoder) return;
    try { d.close(); } catch (e) {}
    b.decoder = null; b.size = null; b.needKey = true;
    hud('thumbnail decode error: ' + why);
    if (++b.failures >= DECODE_TRIES) thumbGiveUp(b);
  }
  function thumbGiveUp(b) {
    b.broken = true;
    b.label.textContent = (b.player || '') + ' (no video)';
  }

  function paintThumbs() {
    thumbRaf = requestAnimationFrame(paintThumbs);
    for (const b of thumbs) {
      if (!b.frame) continue;
      b.canvas.getContext('2d').drawImage(b.frame, 0, 0, b.canvas.width, b.canvas.height);
      b.frame.close(); b.frame = null;
    }
  }

  function pollSpectatePad() {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    const cur = { left: false, right: false };
    for (const g of pads) {
      const b = i => g.buttons[i] && g.buttons[i].pressed;
      cur.left ||= b(14) || g.axes[0] < -0.5; cur.right ||= b(15) || g.axes[0] > 0.5;
    }
    const was = spec.padWas || cur;
    spec.padWas = cur;
    if (cur.left && !was.left) switchPlayer(-1);
    if (cur.right && !was.right) switchPlayer(1);
  }
  $('sp-prev').onclick = () => switchPlayer(-1);
  $('sp-next').onclick = () => switchPlayer(1);
  window.addEventListener('resize', () => {
    layoutSide();
    if (spec.size) { const c = $('feed'); fitFeed(c.width, c.height, c.width / c.height); }
  });

  function handle(p) {
    switch (p.kind) {
      case 'spectate': showSpectate(p); break;
      case 'video': onVideo(p); break;
      case 'audio': onAudio(p); break;
      case 'progress': onProgress(p); break;
      case 'thumbs': onThumbs(p); break;
      case 'thumb': onThumb(p); break;
      case 'loading': playing = []; hideClock(); closeSpectate(); hud('loading round ' + p.round); break;
      case 'clock': showClock(p); break;
      case 'intro': showIntro(p); break;
      case 'go': goWanted = true; tryGo(); break;
      case 'death': replay($('flash'), 'hit'); hud('death at frame ' + p.frame); break;
      case 'garland':
      case 'skull':
        $('badge').innerHTML = (p.kind === 'garland' ? '\u{1F3C6}' : '\u{1F480}') + '<small>' + esc(p.text || '') + '</small>';
        replay($('badge'), 'show');
        hud((p.kind === 'garland' ? 'cleared' : 'out') + ' at frame ' + p.frame);
        // Not once the round card is up: a solo round is over by then. Nor
        // over the spectate sheet, which says who is left itself.
        setTimeout(() => {
          if ($('round').classList.contains('hidden') && $('spectate').classList.contains('hidden') && !introUp) showWaiting(waitingText());
        }, 2000);
        break;
      case 'playing':
        playing = p.players || [];
        if (!$('waiting').classList.contains('hidden')) showWaiting(waitingText());
        break;
      case 'eliminated':
        playing = p.players || [];
        dropRound();
        showWaiting("You're out. " + waitingText());
        hud('eliminated, round ' + p.round);
        break;
      case 'backing': playing = p.players || []; dropRound(); showBacking(p); break;
      case 'sides': onSides(p); break;
      case 'bout_go': hideBacking(); break;
      case 'voided':
        dropRound(); hideClock(); closeSpectate(); hideBacking();
        showWaiting(esc(p.text));
        hud('round ' + p.round + ' void');
        break;
      case 'round': hideClock(); closeSpectate(); hideBacking(); showRound(p); break;
      case 'score': hideClock(); closeSpectate(); hideBacking(); showScore(p); break;
      case 'pause': showPause(p); break;
      case 'resume': hidePause(); hud('playing'); break;
      case 'error': $('error').textContent = p.text; show('error'); hud('error'); break;
      case 'hud': hud(p.text); break;
    }
  }

  $('again').onclick = () => { hide('score'); hide('error'); invoke('play_again'); };
  $('lobby').onclick = () => { hide('score'); invoke('back_to_lobby'); };
  $('resume').onclick = () => { hidePause(); invoke('resume'); };
  $('giveup').onclick = () => { hidePause(); invoke('give_up'); };
  $('end').onclick = () => { hidePause(); invoke('end_match'); };
  // A guest leaving ends the match for everyone (ADR 0030); the host ends it instead.
  $('leave').onclick = () => { hidePause(); invoke('leave'); };
  $('s-leave').onclick = () => { hide('score'); invoke('leave'); };

  // ---- the pause menu, by pad as well as by mouse ----------------------------
  // The game thread is held while this is up, so the page reads the pad
  // itself (the Gamepad API, standard mapping): the d-pad or stick moves,
  // South picks, Start resumes. A button already held when the menu opened —
  // the Start of a Select+Start pause — counts only once it is let go.
  let PAUSE_BUTTONS = ['resume', 'giveup', 'end'];
  let pauseFocus = 0, pauseTimer = null, padWas = null;
  const inputLabel = i => {
    const [kind, rest] = i.split(':');
    if (kind === 'key') return /^(f\d+|.)$/.test(rest) ? rest.toUpperCase() : rest;
    if (kind === 'pad') return rest.charAt(0).toUpperCase() + rest.slice(1);
    return i;
  };
  const chords = cs => (cs || []).map(c => c.map(inputLabel).join('+')).join(' or ') || 'unbound';
  function focusPause(i) {
    pauseFocus = (i + PAUSE_BUTTONS.length) % PAUSE_BUTTONS.length;
    PAUSE_BUTTONS.forEach((id, n) => $(id).classList.toggle('focus', n === pauseFocus));
  }
  function showPause(p) {
    $('pause-keys').textContent = 'Pause: ' + chords(p.pause) + ' · Give up: ' + chords(p.give_up) + ' · F12 quits';
    // Only the host may end the match; a guest may leave it.
    $('end').classList.toggle('hidden', !p.host);
    $('leave').classList.toggle('hidden', !!p.host);
    PAUSE_BUTTONS = ['resume', 'giveup', p.host ? 'end' : 'leave'];
    show('pause'); hud('paused');
    focusPause(0);
    padWas = null;
    if (!pauseTimer) pauseTimer = setInterval(pollPad, 50);
  }
  function hidePause() {
    hide('pause');
    clearInterval(pauseTimer); pauseTimer = null;
    ['resume', 'giveup', 'end', 'leave'].forEach(id => $(id).classList.remove('focus'));
  }
  function pollPad() {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    // Standard mapping: 0 South, 9 Start, 12-15 the d-pad.
    const now = { south: false, start: false, up: false, down: false, left: false, right: false };
    for (const g of pads) {
      const b = i => g.buttons[i] && g.buttons[i].pressed;
      now.south ||= b(0); now.start ||= b(9);
      now.up ||= b(12) || g.axes[1] < -0.5; now.down ||= b(13) || g.axes[1] > 0.5;
      now.left ||= b(14) || g.axes[0] < -0.5; now.right ||= b(15) || g.axes[0] > 0.5;
    }
    const was = padWas || now;
    const pressed = k => now[k] && !was[k];
    padWas = now;
    if (pressed('up') || pressed('left')) focusPause(pauseFocus - 1);
    if (pressed('down') || pressed('right')) focusPause(pauseFocus + 1);
    if (pressed('start')) $('resume').onclick();
    else if (pressed('south')) $(PAUSE_BUTTONS[pauseFocus]).onclick();
  }

  // Tauri's event bridge; `withGlobalTauri` puts it on `window`. Listening
  // needs the `core:default` capability in `capabilities/`; without it the
  // call is refused, and the refusal is the only sign, so it goes on the HUD.
  if (window.__TAURI__ && window.__TAURI__.event) {
    hud('subscribing');
    // Made after the first round was dealt: ask for what was sent before
    // this listened, such as that round's sidebar (ADR 0038).
    window.__TAURI__.event.listen('overlay', e => handle(e.payload))
      .then(() => { hud('listening'); invoke('overlay_ready'); }, err => hud('listen refused: ' + err));
  } else {
    hud('no tauri bridge');
  }
</script>
</body>
</html>
