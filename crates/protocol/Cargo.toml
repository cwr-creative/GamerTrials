[package]
name = "protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The wire between a GamerTrials client and the server: versioned messages with types of their own (ADR 0024)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For conversions only. The wire types are this crate's own, so a change to a
# shared type is a deliberate change here rather than a silent one on the wire.
session-api = { path = "../session-api" }
challenge-core = { path = "../challenge-core" }
